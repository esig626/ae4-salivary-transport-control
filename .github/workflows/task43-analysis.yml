name: Task 43 parameter provenance
on:
  push:
    branches: [analysis/task-43-parameter-provenance]
    paths:
      - 'analysis/43_parameter_provenance/**'
      - '.github/workflows/task43-analysis.yml'
      - '!analysis/43_parameter_provenance/output/**'
      - '!analysis/43_parameter_provenance/*.pdf'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: task43-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provenance:
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/analysis/task-43-parameter-provenance'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cm-super poppler-utils texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science > /tmp/task43-tex-install.log
      - name: Verify saved production parameter inventory
        run: |
          python analysis/43_parameter_provenance/verify.py
          git diff --exit-code 693f44c0b05e92faec737aa7793c3a99ec76445c -- src manuscript model results archive reference
      - name: Compile standalone provenance report
        run: bash analysis/43_parameter_provenance/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task43-verified-report-and-inventory
          path: |
            analysis/43_parameter_provenance/output/
            analysis/43_parameter_provenance/AE4_parameter_provenance.pdf
            analysis/43_parameter_provenance/report.tex
            analysis/43_parameter_provenance/build.log
          retention-days: 30
          if-no-files-found: error
