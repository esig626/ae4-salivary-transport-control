name: Task 43 parameter provenance
on:
  push:
    branches: [analysis/task-43-parameter-provenance]
    paths:
      - 'analysis/43_parameter_provenance/**'
      - '.github/workflows/task43-analysis.yml'
      - '!analysis/43_parameter_provenance/output/**'
      - '!analysis/43_parameter_provenance/*.pdf'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: task43-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provenance:
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/analysis/task-43-parameter-provenance'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cm-super poppler-utils texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science > /tmp/task43-tex-install.log
      - name: Audit actual production parameters
        run: |
          python analysis/43_parameter_provenance/audit.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('analysis/43_parameter_provenance/output')
          a=json.loads((d/'parameter_inventory.json').read_text())
          assert len(a)==105
          assert len({r['name'] for r in a})==105
          assert sum(r['active'] for r in a)==86
          assert sum(r['classification']=='inactive_legacy' for r in a)==5
          (d/'verification.json').write_text(json.dumps({'inventory_assertions':4,'passed':True,'production_parameter_hashes_verified':True},indent=2)+'\n')
          PY
          git diff --exit-code c4d4f207f702d8eee09ab94d2d90ae90552dd641 -- src manuscript model results archive
          printf '{"source_commit":"%s","workflow_run":"%s","base_main":"c4d4f207f702d8eee09ab94d2d90ae90552dd641"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > analysis/43_parameter_provenance/output/build_provenance.json
      - name: Compile standalone provenance report
        run: bash analysis/43_parameter_provenance/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task43-verified-report-and-inventory
          path: |
            analysis/43_parameter_provenance/output/
            analysis/43_parameter_provenance/AE4_parameter_provenance.pdf
            analysis/43_parameter_provenance/report.tex
            analysis/43_parameter_provenance/build.log
          retention-days: 30
          if-no-files-found: error
      - name: Publish verified provenance checkpoint
        env:
          BRANCH: analysis/task-43-parameter-provenance
        run: |
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/43_parameter_provenance/output/ analysis/43_parameter_provenance/AE4_parameter_provenance.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified Task 43 inventory and standalone report"
            git push origin "HEAD:$BRANCH"
          fi
