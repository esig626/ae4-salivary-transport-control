name: Task 14B five percent AE4 check

on:
  push:
    branches:
      - codex/task-14b-five-percent-ae4-check
  workflow_dispatch:

permissions:
  contents: write

jobs:
  five-percent-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install -r requirements-analysis.txt
      - name: Run frozen 5 percent AE4 check
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python -m src.modern_full_model.task14b_five_percent
      - name: Commit diagnostic results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/14B_five_percent_ae4_check analysis/14B_five_percent_ae4_check
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Record five percent AE4 secretion check [skip ci]"
            git push
          fi
