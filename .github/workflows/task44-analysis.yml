name: Task 44 full system analysis
on:
  push:
    branches: [analysis/task-44-full-system-mathematics]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Save exact source snapshot
        run: |
          git rev-parse HEAD > source-sha.txt
          git archive --format=tar.gz -o source-snapshot.tar.gz HEAD
          git bundle create source-history.bundle HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: task44-source-snapshot
          path: |
            source-snapshot.tar.gz
            source-history.bundle
            source-sha.txt
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-python@v5
        if: ${{ hashFiles('analysis/44_full_system_mathematics/run_analysis.py') != '' }}
        with:
          python-version: '3.12'
      - name: Run full system analysis
        if: ${{ hashFiles('analysis/44_full_system_mathematics/run_analysis.py') != '' }}
        run: |
          python -m pip install -r requirements.txt
          python analysis/44_full_system_mathematics/run_analysis.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('analysis/44_full_system_mathematics/run_analysis.py') != '' }}
        with:
          name: task44-analysis-results
          path: analysis/44_full_system_mathematics/output/
          if-no-files-found: error
          retention-days: 30
